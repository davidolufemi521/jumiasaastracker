<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | JumiaTracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); }
        #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 40px 50px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 100%; max-width: 380px; z-index: 10; color: white; text-align: left; }
        h2 { text-align: center; margin-bottom: 20px; font-weight: 300; letter-spacing: 2px; }
        p { text-align: center; font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 30px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: bold; color: rgba(255, 255, 255, 0.9); margin-left: 10px; }
        .input-wrapper { position: relative; margin-bottom: 20px; }
        .input-wrapper i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: rgba(255, 255, 255, 0.7); }
        input { width: 100%; padding: 15px 15px 15px 50px; border: none; border-radius: 30px; background: rgba(255, 255, 255, 0.2); color: white; font-size: 16px; outline: none; box-sizing: border-box; }
        input:focus { background: rgba(255, 255, 255, 0.3); border: 1px solid rgba(255,255,255,0.5); }
        button { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 30px; background: #28a745; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #218838; transform: scale(1.05); }
        .alert { color: #ff6b6b; font-size: 14px; margin-bottom: 15px; text-align: center; background: rgba(255,0,0,0.1); padding: 5px; border-radius: 5px; }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>

    <div class="glass-card">
        <h2><i class="fas fa-shield-alt"></i> NEW PASSWORD</h2>
        <p>Enter the OTP code sent to your email.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label>OTP Code</label>
            <div class="input-wrapper"><i class="fas fa-hashtag"></i><input type="text" name="otp" placeholder="6-digit code" required autocomplete="off"></div>

            <label>New Password</label>
            <div class="input-wrapper"><i class="fas fa-key"></i><input type="password" name="password" placeholder="Create new password" required></div>
            
            <label>Confirm Password</label>
            <div class="input-wrapper"><i class="fas fa-check-circle"></i><input type="password" name="confirm_password" placeholder="Repeat new password" required></div>
            
            <button type="submit">Change Password</button>
        </form>
    </div>

    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particlesArray;
        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x; this.y = y; this.directionX = directionX; this.directionY = directionY; this.size = size; this.color = color;
            }
            draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false); ctx.fillStyle = this.color; ctx.fill(); }
            update() {
                if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;
                this.x += this.directionX; this.y += this.directionY; this.draw();
            }
        }
        function init() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 3) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 2) - 1; let directionY = (Math.random() * 2) - 1;
                let color = 'rgba(255, 255, 255, 0.5)';
                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }
        function connect() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) + 
                                   ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    if (distance < (canvas.width/7) * (canvas.height/7)) {
                        ctx.strokeStyle = 'rgba(255, 255, 255,' + (1 - (distance / 20000)) + ')';
                        ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(particlesArray[a].x, particlesArray[a].y); ctx.lineTo(particlesArray[b].x, particlesArray[b].y); ctx.stroke();
                    }
                }
            }
        }
        function animate() { requestAnimationFrame(animate); ctx.clearRect(0, 0, innerWidth, innerHeight); for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); } connect(); }
        window.addEventListener('resize', function(){ canvas.width = innerWidth; canvas.height = innerHeight; init(); });
        init(); animate();
    </script>
</body>
</html>
