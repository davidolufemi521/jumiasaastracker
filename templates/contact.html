<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Support | JumiaTracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        h2 { margin-bottom: 20px; color: #333; }
        textarea { width: 100%; height: 120px; padding: 15px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 20px; font-family: inherit; }
        .btn { background: #f68b1e; color: white; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; }
        .btn:hover { background: #e07a10; }
    </style>
</head>
<body>
    <div class="box">
        <h2>💬 Send Feedback</h2>
        <p style="color: #666; margin-bottom: 20px;">Found a bug? Or just want to say hi?</p>
        <form method="POST">
            <textarea name="message" placeholder="Type your message here..." required></textarea>
            <button type="submit" class="btn">Send Message 🚀</button>
        </form>
        <a href="/" style="display:block; margin-top:20px; color:#888; text-decoration:none;">← Cancel</a>
    </div>
</body>
</html>
